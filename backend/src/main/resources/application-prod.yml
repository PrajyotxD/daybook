spring:
  datasource:
    # Full override wins (DB_URL), otherwise compose the RDS URL from parts.
    # sslmode defaults to "prefer"; set DB_SSLMODE=require for RDS.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:entries}?sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USERNAME:entries}
    password: ${DB_PASSWORD:entries}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
      pool-name: daybook-pool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

logging:
  level:
    root: INFO
    com.cloudblitz.daybook: INFO
    org.flywaydb: INFO
