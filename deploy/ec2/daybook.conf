# Daybook — Apache virtual host
#
# Serves the Vite build as static files and proxies the API to the Spring Boot
# process on loopback, so the JVM port is never reachable from the internet.
#
# Ubuntu:        /etc/apache2/sites-available/daybook.conf   (then a2ensite daybook)
# Amazon Linux:  /etc/httpd/conf.d/daybook.conf
#
# ${APACHE_LOG_DIR} is defined by Ubuntu's envvars; setup.sh substitutes the
# Amazon Linux path when it installs this file.

ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName daybook.example.com
    DocumentRoot /var/www/daybook

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 30

    # ---- API -----------------------------------------------------------------
    ProxyPass        /api/  http://127.0.0.1:8080/api/
    ProxyPassReverse /api/  http://127.0.0.1:8080/api/

    # ---- OpenAPI docs (drop these three blocks to hide Swagger publicly) -----
    ProxyPass        /swagger-ui  http://127.0.0.1:8080/swagger-ui
    ProxyPassReverse /swagger-ui  http://127.0.0.1:8080/swagger-ui
    ProxyPass        /v3/api-docs http://127.0.0.1:8080/v3/api-docs
    ProxyPassReverse /v3/api-docs http://127.0.0.1:8080/v3/api-docs

    # ---- Health --------------------------------------------------------------
    # Public endpoint for load balancers / uptime checks (Spring readiness).
    ProxyPass        /healthz http://127.0.0.1:8080/actuator/health/readiness
    ProxyPassReverse /healthz http://127.0.0.1:8080/actuator/health/readiness

    # Full actuator surface stays on the box.
    ProxyPass        /actuator/ http://127.0.0.1:8080/actuator/
    <Location /actuator>
        Require ip 127.0.0.1
    </Location>

    # ---- Static SPA ----------------------------------------------------------
    <Directory /var/www/daybook>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Client-side routing: unknown paths return index.html.
        FallbackResource /index.html
    </Directory>

    # Hashed bundles can be cached forever.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # The shell must always be revalidated so deploys are picked up.
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # ---- Compression & headers ----------------------------------------------
    AddOutputFilterByType DEFLATE text/html text/plain text/css \
        application/javascript application/json application/xml image/svg+xml

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/daybook-error.log
    CustomLog ${APACHE_LOG_DIR}/daybook-access.log combined
</VirtualHost>

# ---- HTTPS -------------------------------------------------------------------
# After `certbot --apache -d daybook.example.com` this block is added automatically.
# To redirect HTTP to HTTPS yourself, add:
#
# <VirtualHost *:80>
#     ServerName daybook.example.com
#     Redirect permanent / https://daybook.example.com/
# </VirtualHost>
